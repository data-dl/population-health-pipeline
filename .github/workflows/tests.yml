name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::yaml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check pophealth synth tests
      - run: ruff format --check pophealth synth tests
      - name: generated docs are current
        run: python -m pophealth docs --check
      - name: tests (graded scenario, units, R parity, privacy)
        run: python -m pytest -q
        env:
          POPHEALTH_REQUIRE_R: "1"

  airflow:
    strategy:
      fail-fast: false
      matrix:
        airflow: ["3.3.2", "2.11.2"]
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install Airflow ${{ matrix.airflow }} with its constraints
        run: >-
          pip install "apache-airflow==${{ matrix.airflow }}"
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-3.12.txt"
      - run: pip install duckdb pytest && pip install --no-deps -e .
      - name: the DAG file parses and matches the definitions
        run: python -m pytest -q tests/test_airflow.py
        env:
          POPHEALTH_REQUIRE_AIRFLOW: "1"
