feed: screenings
title: Behavioral health and social needs screenings
description: >-
  One row per screening encounter from the screening platform, item-level and wide: nine PHQ-9
  items, seven GAD-7 items, five social-needs domains and the platform's own totals. The warehouse
  reshapes it to one row per instrument (scored) and one row per item.
steward: Behavioral health data steward
supplier: Screening platform export
snapshot: false
delivery:
  cadence_days: 7
  grace_days: 0
  time_column: screen_date
  freshness: {table: screening_events, column: screen_date}
date_formats: ['%Y-%m-%d', '%m/%d/%Y']
date_columns: [screen_date]
natural_key: [screening_id]

sources:
  screening_platform:
    file_pattern: '^screenings_(?P<extract>[0-9]{8})(?:_r(?P<redelivery>[0-9]+))?\.csv$'
    layouts:
      - version: 1
        columns:
          screening_id: screening_id
          mrn: patient_id
          screen_date: screen_date
          admin_mode: admin_mode
          phq9_q1: phq9_q1
          phq9_q2: phq9_q2
          phq9_q3: phq9_q3
          phq9_q4: phq9_q4
          phq9_q5: phq9_q5
          phq9_q6: phq9_q6
          phq9_q7: phq9_q7
          phq9_q8: phq9_q8
          phq9_q9: phq9_q9
          phq9_total: phq9_total_reported
          gad7_q1: gad7_q1
          gad7_q2: gad7_q2
          gad7_q3: gad7_q3
          gad7_q4: gad7_q4
          gad7_q5: gad7_q5
          gad7_q6: gad7_q6
          gad7_q7: gad7_q7
          gad7_total: gad7_total_reported
          sdoh_housing: sdoh_housing
          sdoh_food: sdoh_food
          sdoh_transport: sdoh_transport
          sdoh_utilities: sdoh_utilities
          sdoh_safety: sdoh_safety

columns:
  - {name: screening_id, type: VARCHAR, classification: operational, description: Platform identifier of the screening encounter.}
  - {name: patient_id, type: VARCHAR, classification: direct_identifier, description: Medical record number.}
  - {name: screen_date, type: DATE, classification: direct_identifier, description: "Date administered (a full date tied to a patient is an identifier)."}
  - {name: admin_mode, type: VARCHAR, classification: operational, description: "in_person, telehealth or portal."}
  - {name: phq9_q1 .. phq9_q9, type: INTEGER, classification: clinical, description: "PHQ-9 item responses, 0-3."}
  - {name: phq9_total_reported, type: INTEGER, classification: clinical, description: Total as computed by the platform (checked, never trusted).}
  - {name: gad7_q1 .. gad7_q7, type: INTEGER, classification: clinical, description: "GAD-7 item responses, 0-3."}
  - {name: gad7_total_reported, type: INTEGER, classification: clinical, description: Total as computed by the platform.}
  - {name: sdoh_housing .. sdoh_safety, type: VARCHAR, classification: clinical, description: "Social needs by domain: Y (need), N (no need), D (declined)."}

rules:
  - id: SCR-001
    type: volume
    title: Delivery volume is in the usual range
    dimension: completeness
    action: block
    min_ratio: 0.25
    min_baseline_rows: 40
  - id: SCR-002
    type: date_format
    title: Dates use the agreed format
    dimension: conformity
    action: warn
    message: The file used a secondary date format; it was detected for the whole file and parsed consistently.
  - id: SCR-003
    type: repair
    title: Medical record numbers keep their leading zeros
    dimension: conformity
    action: repair
    when: "regexp_full_match(patient_id, '[0-9]{1,7}')"
    set: {patient_id: "lpad(patient_id, 8, '0')"}
  - id: SCR-004
    type: required
    title: Screening, patient and date are present
    dimension: completeness
    action: quarantine
    columns: [screening_id, patient_id, screen_date_raw]
  - id: SCR-005
    type: parse
    title: Screening date is a real date
    dimension: validity
    action: quarantine
    column: screen_date
  - id: SCR-006
    type: not_future
    title: Screening date is not after the extract
    dimension: validity
    action: quarantine
    column: screen_date
  - id: SCR-007
    type: expression
    title: Item responses are whole numbers within the instrument's range
    dimension: validity
    action: quarantine
    fail_when: "_bad_items > 0"
    detail: _bad_items_detail
    # Tiered: a handful of bad rows are held and the load goes on;
    # if more than 5% of the file is bad, something is wrong upstream and the file is stopped.
    block_if_rate_over: 0.05
  - id: SCR-008
    type: expression
    title: Social-needs answers are Y, N or D
    dimension: validity
    action: quarantine
    fail_when: "_bad_sdoh > 0"
    detail: _bad_sdoh_detail
  - id: SCR-009
    type: mapped
    title: Administration mode is recognised
    dimension: validity
    action: quarantine
    retryable: true
    column: admin_mode
  - id: SCR-010
    type: on_roster
    title: Patient is on the roster
    dimension: integrity
    action: quarantine
    retryable: true
    column: patient_id
  - id: SCR-011
    type: key_conflict
    title: One version of each screening per file
    dimension: uniqueness
    action: quarantine
  - id: SCR-012
    type: expression
    title: Platform totals agree with the item responses
    dimension: consistency
    action: warn
    fail_when: "_total_mismatch"
    detail: _total_mismatch_detail
    message: The platform's total disagrees with the sum of the items; the computed total is used.
  - id: SCR-013
    type: closed_period
    title: Late rows for a closed measurement year are announced
    dimension: timeliness
    action: warn
    column: screen_date

published: [screening_events, screening_items]
